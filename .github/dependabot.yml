version: 2

# The workflow pins action versions exactly, so something has to keep them
# current — that something is this.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Vite+ and the rest of the web configurator's toolchain. The setup wizard
  # itself depends on none of it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      toolchain:
        patterns: ["*"]

  # Watches the Dockerfile's base image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
