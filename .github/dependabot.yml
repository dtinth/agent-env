version: 2

# The workflow pins action versions exactly, so something has to keep them
# current — that something is this.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Vite+ and the rest of the web configurator's toolchain. The setup wizard
  # itself depends on none of it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      toolchain:
        patterns: ["*"]
    ignore:
      # The types describe the oldest Node the wizard promises to run on
      # (`engines` in package.json), not the newest. Newer majors would let
      # the type check pass on APIs that Node 22 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Watches the Dockerfile's base image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
