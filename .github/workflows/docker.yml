name: docker

# Builds the image for amd64 and arm64 on native runners, smoke-tests each one,
# and only then publishes a multi-arch manifest to GHCR.
#
# Action versions are pinned exactly and kept current by Dependabot
# (.github/dependabot.yml).

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  # OPENCODE_VERSION defaults to the `beta` dist-tag, so a rebuild picks up new
  # OpenCode v2 builds even when nothing in this repo changed.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The setup wizard is what most people meet first, and it is the only part of
  # this repository that can be wrong without the image being wrong. It runs on
  # its own, before anything is pulled, so it gets its own job.
  setup:
    name: setup wizard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x

      - name: Typecheck, lint and format
        run: deno task check

      - name: Test
        run: deno task test

      # The generated compose file has to be something Docker will actually
      # accept, which the unit tests cannot tell us.
      - name: The generated compose files are valid
        run: |
          set -euo pipefail
          for mode in local caddy github tailscale; do
            dir="$(mktemp -d)"
            case "${mode}" in
              local) answers='{"mode":"local","behindProxy":false,"authMode":"basic","gatewayUser":"opencode"}' ;;
              caddy) answers='{"mode":"caddy","domain":"agent.example.com","httpsPort":8443,"authMode":"google","googleClientId":"1.apps.googleusercontent.com","allowedEmails":"me@example.com"}' ;;
              github) answers='{"mode":"caddy","domain":"gh.example.com","httpsPort":8443,"authMode":"github","githubClientId":"Iv1.0123456789abcdef","githubOrg":"acme","githubTeam":"platform"}' ;;
              tailscale) answers='{"mode":"tailscale","tsHostname":"work.tail1234.ts.net","authMode":"none"}' ;;
            esac
            common='"opencodeEnable":true,"dashboard":true,"rootlessDocker":true,"sshKeys":"ssh-ed25519 AAAA t@h","sshPort":2222,"workspaceKind":"volume","timezone":"UTC"'
            echo "${answers%\}}, ${common}}" > "${dir}/a.json"
            deno run -A setup.ts --answers "${dir}/a.json" --out "${dir}"
            ( cd "${dir}" && docker compose config -q )
            echo "::notice::${mode} compose is valid"

            # A generated Caddyfile that compose accepts can still be one Caddy
            # refuses, and that failure only shows up at first start in domain
            # mode. Ask Caddy itself.
            if [ -f "${dir}/Caddyfile" ]; then
              docker run --rm -v "${dir}/Caddyfile:/tmp/Caddyfile:ro" \
                --entrypoint caddy caddy:2-alpine \
                validate --config /tmp/Caddyfile --adapter caddyfile
              echo "::notice::${mode} Caddyfile is valid"
            fi
          done

  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            # Native arm64 runners are free and unlimited on public repos.
            # QEMU emulation would take hours for an image with this much apt.
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are applied later, when the per-architecture digests are merged
      # into one manifest list. Here we only want the labels.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # On a push we publish the architecture image by digest, untagged, so a
      # failed smoke test can never leave a broken `:latest` behind. On a pull
      # request there are no registry credentials, so build into the local
      # daemon instead.
      - name: Build and push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Build for testing
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: agent-env:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Resolve the image to test
        id: ref
        run: |
          if [ -n "${{ steps.push.outputs.digest }}" ]; then
            # Test the exact artifact that was pushed, not a rebuild of it.
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=agent-env:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          password="ci-$(openssl rand -hex 12)"

          docker run -d --name agent-env --shm-size=2g \
            -p 8080:8080 -p 8081:8081 -p 2222:22 \
            -e AUTH_MODE=basic \
            -e "GATEWAY_PASSWORD=${password}" \
            -e PUBLIC_URL=http://localhost:8080 \
            -e DASHBOARD_PUBLIC_URL=http://localhost:8081 \
            "${IMAGE}"

          # The image's own HEALTHCHECK is the readiness signal.
          for _ in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' agent-env)
            [ "$state" = healthy ] && break
            if [ "$state" = unhealthy ]; then
              echo "::error::container went unhealthy"; docker logs agent-env; exit 1
            fi
            sleep 5
          done

          CONTAINER=agent-env ./scripts/smoke-test.sh \
            http://localhost:8080 "opencode:${password}"

      # OPENCODE_ENABLE=false is a supported deployment, and it is the one the
      # default run cannot reach: a different handler at /, no credential
      # injection, a login shell instead of the TUI, and a healthcheck that has
      # to stop probing a port that is deliberately not there. Untested, it
      # would only break for whoever turned it off first.
      - name: Smoke test with OpenCode off
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          password="ci-$(openssl rand -hex 12)"

          docker rm -f agent-env-noc >/dev/null 2>&1 || true

          # SMOKE_OVERSIZE_FILE rides along on a container this job already
          # starts, so the check costs no extra runtime: an oversized *_FILE
          # must not brick startup. Without the entrypoint's size guard this
          # container never reaches healthy and the wait below fails, so the
          # regression cannot land quietly.
          docker run -d --name agent-env-noc --shm-size=2g \
            -p 8082:8080 \
            -e AUTH_MODE=basic \
            -e "GATEWAY_PASSWORD=${password}" \
            -e OPENCODE_ENABLE=false \
            -e AB_DASHBOARD_ENABLE=false \
            -e PUBLIC_URL=http://localhost:8082 \
            -e SMOKE_OVERSIZE_FILE=/etc/ssl/certs/ca-certificates.crt \
            "${IMAGE}"

          # The healthcheck must go healthy with no OpenCode server at all —
          # that is the regression this run exists to catch.
          for _ in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' agent-env-noc)
            [ "$state" = healthy ] && break
            if [ "$state" = unhealthy ]; then
              echo "::error::OpenCode-off container went unhealthy"
              docker logs agent-env-noc; exit 1
            fi
            sleep 5
          done

          CONTAINER=agent-env-noc ./scripts/smoke-test.sh \
            http://localhost:8082 "opencode:${password}"

      # The smoke suite tests one running container, so it can only ever see
      # one way of configuring the gate. What varies between the rest is how
      # the entrypoint *renders* oauth2-proxy's arguments, and a mistake there
      # produces a proxy that starts perfectly well and cannot complete a
      # sign-in — or one that lets everybody in. Neither is visible above.
      - name: Auth matrix
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: ./scripts/auth-matrix.sh "${IMAGE}"

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs agent-env 2>&1 | tail -200 || true
          docker logs agent-env-noc 2>&1 | tail -200 || true

      - name: Record the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # The sha256: prefix is stripped because artifact entries cannot
          # contain a colon; the publish job puts it back.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          # One file per architecture, merged by the next job.
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # provenance attestation
      attestations: write

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and annotations
        id: meta
        uses: docker/metadata-action@v6.2.0
        env:
          # `imagetools create` builds an index, and it rejects the manifest:
          # level annotations this action emits by default.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          # Built as a bash array rather than interpolated into one string:
          # annotation values contain spaces, and word-splitting a command
          # substitution would tear them apart.
          # metadata-action v6 emits a flat document; v5 and earlier nested it
          # under a bake target. Accept either, so bumping the action cannot
          # silently produce an empty tag list again.
          mapfile -t tags < <(jq -r '
            (.tags // .target."docker-metadata-action".tags // [])[]
          ' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          # Only index-level annotations, and only ones with a value:
          #   - imagetools create errors on `manifest:` ("not supported yet"),
          #     so filtering here keeps this working even if the levels env
          #     above is ever changed;
          #   - description and licenses come out empty unless set on the repo.
          mapfile -t annotations < <(jq -r '
            (.annotations // .target."docker-metadata-action".annotations // [])[]
            | select(startswith("index:"))
            | select(endswith("=") | not)
          ' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::no tags were produced; refusing to publish an untagged manifest"
            exit 1
          fi

          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          for annotation in "${annotations[@]}"; do args+=(--annotation "$annotation"); done

          sources=()
          for digest in *; do
            sources+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done

          printf 'merging %d architecture image(s)\n' "${#sources[@]}"
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

      - name: Read the manifest digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            jq -r '(.tags // .target."docker-metadata-action".tags // [])[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo '```'
            echo
            echo "Digest: \`${{ steps.digest.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
