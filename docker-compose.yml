services:
  agent-env:
    build:
      context: .
      args:
        # Pin these for reproducible builds.
        OPENCODE_VERSION: beta
    image: agent-env:latest
    container_name: agent-env
    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    ports:
      - "${HOST_GATEWAY_PORT:-8080}:8080"   # OpenCode web UI, TUI, desktop
      - "${HOST_DASHBOARD_PORT:-8081}:8081" # agent-browser dashboard
      - "${HOST_SSH_PORT:-2222}:22"         # SSH
      # mosh (UDP). The client picks a port from the range, so it has to match
      # what you pass: mosh -p 60000:60010 --ssh="ssh -p 2222" dev@host
      - "${HOST_MOSH_PORTS:-60000-60010}:60000-60010/udp"

    # Chromium needs more than the default 64 MB of /dev/shm.
    shm_size: "2gb"

    volumes:
      - workspace:/workspace
      # The whole home directory: installed tools, dotfiles, OpenCode sessions
      # and provider logins all live here and should outlive the container.
      - home:/home/dev
      # Keeps the generated SSH host keys across image updates. Without it,
      # clients see a changed-host-key warning every time you recreate.
      - agent-env-state:/var/lib/agent-env

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  workspace:
  home:
  agent-env-state:
