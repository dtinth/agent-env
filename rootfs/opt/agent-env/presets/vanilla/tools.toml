# The vanilla preset installs no agent. agent-browser stays so a browser works the
# same way in every preset; delete it from the volume's own config if you do not
# want it.
#
# The entrypoint copies this to ~/.config/mise/conf.d/ on every start, so edits
# there are lost: to pin a version, declare the tool yourself in
# ~/.config/mise/config.toml, which takes precedence.
#
# `allow_builds` lets the package's postinstall script run; mise skips scripts by
# default, and this one uses its own to select a native binary.

[tools]
"npm:agent-browser" = { version = "latest", allow_builds = ["agent-browser"] }
