# The opencode preset's tools, installed into the home volume and upgraded at
# every start. The entrypoint copies this to ~/.config/mise/conf.d/ on every
# start, so edits there are lost: to pin a version, declare the tool yourself in
# ~/.config/mise/config.toml, which takes precedence. A preset may omit this file
# if it installs nothing of its own; tools every preset gets live in ../../mise.d.
#
# `allow_builds` lets the package's postinstall script run; mise skips scripts by
# default, and this one uses its own to select a native binary.

[tools]
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
